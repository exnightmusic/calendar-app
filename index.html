<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Календарь Смен</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2a2a2a;
            --text-main: #ffffff;
            --text-muted: #888888;
            --border-color: #444444;
            --accent: #0ea5e9;
            --accent2: #a855f7;
            --gradient: linear-gradient(135deg, #0ea5e9, #a855f7);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 15px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: var(--bg-color); color: var(--text-main); padding-bottom: 80px; overflow-x: hidden; }

        .header { text-align: center; margin-bottom: 15px; }
        .month-title {
            font-size: 26px;
            font-weight: 800;
            background: var(--gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            user-select: none;
            -webkit-user-select: none;
        }
        .month-total-row { display: flex; justify-content: center; align-items: center; gap: 10px; }
        .total-month { display: inline-block; background-color: rgba(255,255,255,0.08); padding: 5px 14px; border-radius: 20px; font-size: 14px; color: #ccc; border: 1px solid rgba(255,255,255,0.05); }
        .settings-btn {
            background: var(--gradient);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(14,165,233,0.3);
            transition: transform 0.1s;
        }
        .settings-btn:active { transform: scale(0.9); }

        .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
        .weekend-label { color: rgba(239, 68, 68, 0.7); }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; touch-action: pan-y; }
        .calendar-grid.slide-in-left { animation: slideInLeft 0.3s ease-out; }
        .calendar-grid.slide-in-right { animation: slideInRight 0.3s ease-out; }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(-40px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .day-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 14px;
            cursor: pointer;
            position: relative;
            background-color: transparent;
            transition: transform 0.1s, background 0.2s;
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
            user-select: none;
            -webkit-user-select: none;
        }
        .day-cell.empty { pointer-events: none; }
        .day-cell:active:not(.empty) { transform: scale(0.92); }
        .day-cell.weekend { background: rgba(239, 68, 68, 0.06); }
        .day-cell.today {
            box-shadow: 0 0 0 2px var(--accent), 0 0 15px rgba(168,85,247,0.5);
            animation: todayPulse 2s ease-in-out infinite;
            z-index: 1;
        }
        @keyframes todayPulse {
            0%, 100% { box-shadow: 0 0 0 2px var(--accent), 0 0 15px rgba(168,85,247,0.5); }
            50% { box-shadow: 0 0 0 2px var(--accent2), 0 0 22px rgba(14,165,233,0.8); }
        }
        .dots-container { display: flex; gap: 2px; position: absolute; bottom: 2px; }
        .dot { width: 4px; height: 4px; border-radius: 50%; }
        .note-icon { position: absolute; top: -2px; right: -2px; font-size: 10px; line-height: 1; pointer-events: none; }

        .bottom-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.08);
            display: flex;
            padding: 10px;
            gap: 5px;
            overflow-x: auto;
        }
        .summary-box { flex: 0 0 auto; min-width: 70px; text-align: center; background: var(--card-bg); padding: 8px 5px; border-radius: 8px; cursor: pointer; transition: transform 0.1s, background 0.2s; user-select: none; -webkit-user-select: none; }
        .summary-box:hover { background: #333; }
        .summary-box:active { transform: scale(0.95); }
        .summary-title { font-size: 10px; color: var(--text-muted); white-space: nowrap; }
        .summary-value { font-size: 14px; font-weight: bold; margin-top: 2px; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: rgba(30, 30, 40, 0.78);
            backdrop-filter: blur(30px) saturate(160%);
            -webkit-backdrop-filter: blur(30px) saturate(160%);
            border: 1px solid rgba(255,255,255,0.08);
            width: 100%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-date { font-size: 20px; font-weight: bold; }
        .btn-text { background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; transition: transform 0.1s; }
        .btn-text:active { transform: scale(0.9); }

        .input-group { margin-bottom: 15px; position: relative; }
        .input-group label { position: absolute; top: -8px; left: 10px; background: rgba(30, 30, 40, 0.95); padding: 0 4px; font-size: 12px; color: var(--text-muted); }
        .input-group input { width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--border-color); color: white; padding: 12px; border-radius: 8px; font-size: 16px; outline: none; font-family: inherit; }
        .input-group input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(14,165,233,0.2); }
        .computed-sum { text-align: center; font-weight: bold; margin: 5px 0 15px 0; font-size: 14px; }

        .shift-types { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
        .type-btn { flex: 1 1 30%; padding: 10px; background: transparent; border: 1px solid var(--border-color); color: white; border-radius: 8px; font-size: 14px; cursor: pointer; transition: transform 0.1s; font-family: inherit; }
        .type-btn:active { transform: scale(0.95); }

        .modal-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
        .btn-save {
            background: var(--gradient);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(14,165,233,0.3);
            transition: transform 0.1s;
            font-family: inherit;
        }
        .btn-save:active { transform: scale(0.95); }
        .btn-delete { color: #ef4444; font-size: 16px; background: none; border: none; cursor: pointer; font-weight: bold; transition: transform 0.1s; font-family: inherit; }
        .btn-delete:active { transform: scale(0.95); }

        .template-btn {
            padding: 6px 10px;
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            white-space: nowrap;
            font-family: inherit;
        }
        .template-btn:active { background: rgba(255,255,255,0.2); transform: scale(0.95); }
        .save-tpl-btn {
            display: block;
            width: 100%;
            margin: 0 auto 15px auto;
            padding: 10px 14px;
            background: transparent;
            border: 1px dashed #555;
            color: #aaa;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
            transition: transform 0.1s;
        }
        .save-tpl-btn:active { transform: scale(0.97); }

        .detail-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 14px; gap: 10px; }
        .detail-row:last-child { border-bottom: none; }
        .detail-date { color: #ccc; font-weight: 500; }
        .detail-sub { color: #888; font-size: 12px; margin-top: 3px; }
        .detail-amount { font-weight: bold; color: #fff; white-space: nowrap; }
        .details-total { margin-top: 15px; padding-top: 15px; border-top: 2px solid rgba(255,255,255,0.15); font-weight: bold; font-size: 16px; display: flex; justify-content: space-between; }
        .empty-details { text-align: center; color: #888; padding: 30px 10px; font-size: 14px; }

        .settings-section-title {
            font-size: 12px;
            font-weight: bold;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 10px;
            margin-top: 18px;
        }
        .settings-section-title:first-child { margin-top: 0; }
        .type-item { padding: 14px; border: 1px solid rgba(255,255,255,0.08); background: rgba(0,0,0,0.15); border-radius: 12px; margin-bottom: 12px; }
        .type-item-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
        .type-name-input {
            flex: 1;
            background: rgba(0,0,0,0.25);
            border: 1px solid var(--border-color);
            color: white;
            padding: 9px 10px;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
        }
        .type-name-input:focus { border-color: var(--accent); }
        .color-picker { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
        .color-dot {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.1s, box-shadow 0.15s;
        }
        .color-dot:active { transform: scale(0.85); }
        .color-dot.selected { border-color: white; box-shadow: 0 0 0 3px rgba(255,255,255,0.2); }

        .segment-control { display: flex; background: rgba(0,0,0,0.3); border-radius: 10px; padding: 3px; gap: 3px; }
        .segment-btn {
            flex: 1;
            padding: 9px 4px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 11px;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            font-weight: 500;
        }
        .segment-btn:active { transform: scale(0.95); }
        .segment-btn.active {
            background: var(--gradient);
            color: white;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(14,165,233,0.3);
        }

        .icon-delete { background: transparent; border: none; color: #ef4444; font-size: 18px; cursor: pointer; padding: 4px 8px; transition: transform 0.1s; }
        .icon-delete:active { transform: scale(0.85); }
        .add-type-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px dashed var(--accent);
            color: var(--accent);
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 10px;
            font-family: inherit;
            transition: transform 0.1s;
        }
        .add-type-btn:active { transform: scale(0.97); }

        .settings-sync-btn {
            background: var(--gradient);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            box-shadow: 0 4px 14px rgba(14,165,233,0.35);
            font-family: inherit;
            transition: transform 0.1s;
        }
        .settings-sync-btn:active { transform: scale(0.97); }
        .settings-load-btn {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 12px;
            width: 100%;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            font-family: inherit;
            transition: transform 0.1s;
        }
        .settings-load-btn:active { transform: scale(0.97); }

        .toast-container {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 4000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            pointer-events: none;
            width: 100%;
            padding: 0 15px;
        }
        .toast {
            background: rgba(30, 30, 40, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            animation: toastIn 0.3s ease-out;
            max-width: 340px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .toast-success { border-left: 3px solid #22c55e; }
        .toast-error { border-left: 3px solid #ef4444; }
        .toast-info { border-left: 3px solid #0ea5e9; }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .toast-out { animation: toastOut 0.3s ease-in forwards; }
        @keyframes toastOut {
            to { opacity: 0; transform: translateY(20px); }
        }

        .confirm-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .confirm-overlay.active { opacity: 1; }
        .confirm-box {
            background: rgba(30, 30, 40, 0.9);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 24px;
            max-width: 340px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
            transform: scale(0.9);
            transition: transform 0.2s;
        }
        .confirm-overlay.active .confirm-box { transform: scale(1); }
        .confirm-message { font-size: 15px; margin-bottom: 20px; line-height: 1.4; }
        .confirm-actions { display: flex; gap: 8px; }
        .confirm-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            transition: transform 0.1s;
        }
        .confirm-btn:active { transform: scale(0.96); }
        .confirm-cancel { background: rgba(255,255,255,0.1); color: white; }
        .confirm-ok { background: var(--gradient); color: white; }
        .confirm-ok.danger { background: linear-gradient(135deg, #ef4444, #dc2626); }
    </style>
</head>
<body>

    <div class="header">
        <div class="month-title" id="currentMonth">Месяц</div>
        <div class="month-total-row">
            <div class="total-month" id="monthTotal">Общая: 0 р.</div>
            <button class="settings-btn" onclick="openSettings()">⚙️</button>
        </div>
    </div>

    <div class="weekdays">
        <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div>
        <div class="weekend-label">Сб</div><div class="weekend-label">Вс</div>
    </div>
    
    <div class="calendar-grid" id="calendarGrid"></div>

    <div class="bottom-panel" id="bottomPanel"></div>

    <!-- Модалка редактирования дня -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-date" id="modalDate">10 ноября</div>
                <button class="btn-text" onclick="closeModal()">✖</button>
            </div>

            <div id="templatesSection" style="display: none; margin-bottom: 15px;">
                <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 6px;">Шаблоны (нажми чтобы применить, долгое нажатие — удалить):</div>
                <div id="templatesList" style="display: flex; flex-wrap: wrap; gap: 6px;"></div>
            </div>
            
            <div style="font-size: 14px; margin-bottom: 10px; font-weight: bold;">Тип смены (можно несколько):</div>
            <div class="shift-types" id="shiftTypesContainer"></div>

            <div id="hourlyFields" style="display: none;">
                <div class="input-group">
                    <label>Ставка за час (р.)</label>
                    <input type="number" id="hourlyRate" value="11.5" step="0.1" oninput="calculateHours()">
                </div>
                <div class="input-group">
                    <label>Начало (ЧЧ:ММ)</label>
                    <input type="text" id="startTime" placeholder="07:40" oninput="calculateHours()">
                </div>
                <div class="input-group">
                    <label>Конец (ЧЧ:ММ)</label>
                    <input type="text" id="endTime" placeholder="19:40" oninput="calculateHours()">
                </div>
                <div class="computed-sum" id="hourlySum">Часов: 0, Сумма: 0 р.</div>
            </div>

            <div id="pieceFields" style="display: none;">
                <div class="input-group">
                    <label>Сумма (общая)</label>
                    <input type="number" id="pieceSum" placeholder="1177" oninput="calculatePiece()">
                </div>
                <div class="input-group">
                    <label>Кол-во людей</label>
                    <input type="number" id="piecePeople" placeholder="6" oninput="calculatePiece()">
                </div>
                <div class="computed-sum" id="pieceResult">Сумма: 0 р.</div>
            </div>

            <div class="input-group" style="margin-top: 20px;">
                <label>Заметка</label>
                <input type="text" id="noteInput" placeholder="Введите текст...">
            </div>

            <button class="save-tpl-btn" onclick="saveAsTemplate()">⭐ Сохранить как шаблон</button>

            <div class="modal-actions">
                <button class="btn-delete" id="btnDelete" onclick="deleteShift()">Удалить</button>
                <button class="btn-text" onclick="closeModal()">Отмена</button>
                <button class="btn-save" onclick="saveShift()">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- Модалка детализации -->
    <div class="modal-overlay" id="detailsModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-date" id="detailsTitle">Детали</div>
                <button class="btn-text" onclick="closeDetailsModal()">✖</button>
            </div>
            <div id="detailsList"></div>
            <div class="details-total">
                <span>Итого:</span>
                <span id="detailsTotal">0 р.</span>
            </div>
        </div>
    </div>

    <!-- Модалка настроек -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-date">⚙️ Настройки</div>
                <button class="btn-text" onclick="closeSettings()">✖</button>
            </div>

            <div class="settings-section-title">💰 Типы смен</div>
            <div id="typesList"></div>
            <button class="add-type-btn" onclick="addType()">➕ Добавить тип смены</button>
            <button class="save-tpl-btn" onclick="resetTypes()">🔄 Сбросить к стандартным типам</button>

            <div class="settings-section-title">☁️ Синхронизация</div>
            <button class="settings-sync-btn" onclick="syncToCloud()">☁️ Сохранить всё в облако</button>
            <button class="settings-load-btn" onclick="loadFromCloud()">📥 Загрузить из облака</button>
        </div>
    </div>

    <script>
        const DEFAULT_TYPES = [
            { id: 'red',    name: 'Смена',    color: '#ef4444', mode: 'piece',  builtin: true },
            { id: 'blue',   name: 'Увязка',   color: '#0ea5e9', mode: 'hourly', builtin: true },
            { id: 'green',  name: 'Ночь',     color: '#22c55e', mode: 'piece',  builtin: true },
            { id: 'orange', name: 'Другая',   color: '#f97316', mode: 'piece',  builtin: true },
            { id: 'purple', name: 'Выходной', color: '#a855f7', mode: 'none',   builtin: true }
        ];
        const PALETTE = [
            '#ef4444', '#f97316', '#f59e0b', '#eab308', '#22c55e', '#10b981',
            '#06b6d4', '#0ea5e9', '#6366f1', '#a855f7', '#ec4899', '#888888'
        ];
        const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];

        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth();
        let selectedDateStr = "";
        let shiftsData = JSON.parse(localStorage.getItem('shiftsData')) || {};
        shiftsData = migrateData(shiftsData);

        let shiftTypes = JSON.parse(localStorage.getItem('shiftTypes') || 'null');
        if (!shiftTypes || !Array.isArray(shiftTypes) || shiftTypes.length === 0) {
            shiftTypes = JSON.parse(JSON.stringify(DEFAULT_TYPES));
            localStorage.setItem('shiftTypes', JSON.stringify(shiftTypes));
        }

        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        try { tg.disableVerticalSwipes(); } catch (e) { console.warn('disableVerticalSwipes не поддерживается', e); }

        // ===== УТИЛИТЫ =====
        function getType(id) { return shiftTypes.find(t => t.id === id) || null; }
        function getTypeColor(id) { const t = getType(id); return t ? t.color : '#888888'; }
        function hexToRgba(hex, alpha) {
            if (!hex || hex.length < 7) return `rgba(136,136,136,${alpha})`;
            const r = parseInt(hex.slice(1,3), 16);
            const g = parseInt(hex.slice(3,5), 16);
            const b = parseInt(hex.slice(5,7), 16);
            return `rgba(${r},${g},${b},${alpha})`;
        }
        function migrateData(data) {
            for (const dateStr in data) {
                const d = data[dateStr];
                if (!d) continue;
                if (d.totalHourly === undefined) d.totalHourly = d.total || 0;
                if (d.mySharePiece === undefined) d.mySharePiece = d.myShare || 0;
                if (d.totalAmount === undefined) d.totalAmount = (d.totalHourly || 0) + (d.mySharePiece || 0);
            }
            return data;
        }
        function saveTypes() { localStorage.setItem('shiftTypes', JSON.stringify(shiftTypes)); }
        function saveShifts() { localStorage.setItem('shiftsData', JSON.stringify(shiftsData)); }

        // ===== TOASTS И CONFIRM =====
        function showToast(message, type = 'success') {
            let container = document.getElementById('toastContainer');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toastContainer';
                container.className = 'toast-container';
                document.body.appendChild(container);
            }
            while (container.children.length >= 3) container.firstChild.remove();
            const toast = document.createElement('div');
            toast.className = 'toast toast-' + type;
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('toast-out');
                setTimeout(() => toast.remove(), 300);
            }, 2200);
        }

        function showConfirm(message, options = {}) {
            return new Promise((resolve) => {
                const overlay = document.createElement('div');
                overlay.className = 'confirm-overlay';
                overlay.innerHTML = `
                    <div class="confirm-box">
                        <div class="confirm-message">${message}</div>
                        <div class="confirm-actions">
                            <button class="confirm-btn confirm-cancel">${options.cancelText || 'Отмена'}</button>
                            <button class="confirm-btn confirm-ok ${options.danger ? 'danger' : ''}">${options.okText || 'OK'}</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(overlay);
                requestAnimationFrame(() => overlay.classList.add('active'));
                const close = (result) => {
                    overlay.classList.remove('active');
                    setTimeout(() => overlay.remove(), 200);
                    resolve(result);
                };
                overlay.querySelector('.confirm-cancel').onclick = () => close(false);
                overlay.querySelector('.confirm-ok').onclick = () => close(true);
                overlay.onclick = (e) => { if (e.target === overlay) close(false); };
            });
        }

        // ===== РЕНДЕР =====
        function renderAll() {
            renderCalendar();
            renderBottomPanel();
            updateSummary();
        }

        function changeMonth(delta) {
            currentMonth += delta;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar();
            animateGrid(delta);
        }

        function animateGrid(delta) {
            const grid = document.getElementById('calendarGrid');
            grid.classList.remove('slide-in-left', 'slide-in-right');
            void grid.offsetWidth;
            grid.classList.add(delta > 0 ? 'slide-in-left' : 'slide-in-right');
        }

        function renderCalendar() {
            document.getElementById('currentMonth').innerText = monthNames[currentMonth] + " " + currentYear;
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            const firstDay = new Date(currentYear, currentMonth, 1);
            const lastDay = new Date(currentYear, currentMonth + 1, 0);
            const daysInMonth = lastDay.getDate();
            let startDayOfWeek = firstDay.getDay();
            if (startDayOfWeek === 0) startDayOfWeek = 7;

            for (let i = 1; i < startDayOfWeek; i++) {
                const empty = document.createElement('div');
                empty.className = 'day-cell empty';
                grid.appendChild(empty);
            }

            for (let d = 1; d <= daysInMonth; d++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell';
                cell.innerText = d;
                const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const data = shiftsData[dateStr];

                const weekDay = (startDayOfWeek + d - 2) % 7;
                const isWeekend = weekDay === 5 || weekDay === 6;
                if (isWeekend && !data) cell.classList.add('weekend');
                
                if (data && data.types && data.types.length > 0) {
                    const types = data.types;
                    if (types.length === 1) {
                        cell.style.background = hexToRgba(getTypeColor(types[0]), 0.35);
                        cell.style.border = '1px solid ' + getTypeColor(types[0]);
                        cell.style.color = '#fff';
                    } else {
                        const step = 100 / types.length;
                        const stops = types.map((t, i) => `${hexToRgba(getTypeColor(t), 0.35)} ${i*step}% ${(i+1)*step}%`).join(', ');
                        cell.style.background = `conic-gradient(${stops})`;
                        cell.style.border = '1px solid ' + getTypeColor(types[0]);
                        cell.style.color = '#fff';
                    }

                    if (data.note && data.note.trim()) {
                        const noteIcon = document.createElement('div');
                        noteIcon.className = 'note-icon';
                        noteIcon.innerText = '📝';
                        cell.appendChild(noteIcon);
                    }

                    const dots = document.createElement('div');
                    dots.className = 'dots-container';
                    types.forEach(t => {
                        const dot = document.createElement('div');
                        dot.className = 'dot';
                        dot.style.background = getTypeColor(t);
                        dots.appendChild(dot);
                    });
                    cell.appendChild(dots);
                }

                const today = new Date();
                if (d === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear()) {
                    cell.classList.add('today');
                }

                cell.onclick = function() {
                    if (Date.now() - lastSwipeTime < 300) return;
                    openModal(dateStr, d);
                };
                grid.appendChild(cell);
            }
        }

        function renderBottomPanel() {
            const panel = document.getElementById('bottomPanel');
            panel.innerHTML = '';

                const title = document.createElement('div');
                title.className = 'summary-title';
                title.innerText = type.name;
                const value = document.createElement('div');
                value.className = 'summary-value';

                box.appendChild(title);
                box.appendChild(value);

            const totalBox = document.createElement('div');

            totalBox.innerHTML = '<div class="summary-title">Всего</div><div class="summary-value" id="sum_total">0,0</div>';
            panel.appendChild(totalBox);

        // ===== СВАЙП =====
        let touchStartX = 0;
        let touchStartY = 0;
        let lastSwipeTime = 0;
        const gridEl = document.getElementById('calendarGrid');
        gridEl.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });
        gridEl.addEventListener('touchend', e => {
            const dx = e.changedTouches[0].screenX - touchStartX;
            const dy = e.changedTouches[0].screenY - touchStartY;
            if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
                lastSwipeTime = Date.now();

            }

        function toggleType(btn) {
            btn.classList.toggle('active');

            if (btn.classList.contains('active') && type) {
                btn.style.background = type.color;
                btn.style.borderColor = type.color;

                btn.style.borderColor = '';
            }

        function updateFieldVisibility() {
            const activeIds = Array.from(document.querySelectorAll('.type-btn.active')).map(b => b.dataset.type);
            const activeTypes = activeIds.map(id => getType(id)).filter(Boolean);
            const hasHourly = activeTypes.some(t => t.mode === 'hourly');
            const hasPiece = activeTypes.some(t => t.mode === 'piece');
            document.getElementById('hourlyFields').style.display = hasHourly ? 'block' : 'none';
            document.getElementById('pieceFields').style.display = hasPiece ? 'block' : 'none';
        }

        function closeModal() { document.getElementById('modal').classList.remove('active'); }

        function parseTime(timeStr) {
            if (!timeStr) return null;
            let t = timeStr.trim().replace('.', ':');
            if (!t.includes(':')) {
                if (t.length === 4) t = t.substring(0, 2) + ':' + t.substring(2);
                else if (t.length === 3) t = t.substring(0, 1) + ':' + t.substring(1);
                else return null;
            }
            const parts = t.split(':');
            if (parts.length !== 2) return null;
            const h = parseInt(parts[0]);
            const m = parseInt(parts[1]);
            if (isNaN(h) || isNaN(m)) return null;
            return { h, m };
        }

        function calculateHours() {
            const startVal = document.getElementById('startTime').value;
            const endVal = document.getElementById('endTime').value;
            const rate = parseFloat(document.getElementById('hourlyRate').value) || 11.5;
            const start = parseTime(startVal);
            const end = parseTime(endVal);
            if (start && end) {
                let diff = (end.h * 60 + end.m) - (start.h * 60 + start.m);
                if (diff < 0) diff += 24 * 60;
                const hours = diff / 60;
                const sum = hours * rate;
                document.getElementById('hourlySum').innerText = `Отработано: ${hours.toFixed(2)} ч. Сумма: ${sum.toFixed(2)} р.`;
            } else {
                document.getElementById('hourlySum').innerText = 'Часов: 0, Сумма: 0 р.';
            }
        }

        function calculatePiece() {
            const sum = parseFloat(document.getElementById('pieceSum').value) || 0;
            const people = parseInt(document.getElementById('piecePeople').value) || 1;
            if (sum > 0) {
                document.getElementById('pieceResult').innerText = `Сумма: ${(sum / people).toFixed(2)} р.`;
            } else {
                document.getElementById('pieceResult').innerText = 'Сумма: 0 р.';
            }
        }

        function saveShift() {
            const activeIds = Array.from(document.querySelectorAll('.type-btn.active')).map(b => b.dataset.type);
            if (activeIds.length === 0) { showToast('Выбери хотя бы один тип смены', 'error'); return; }

            const activeTypes = activeIds.map(id => getType(id)).filter(Boolean);
            const hasHourly = activeTypes.some(t => t.mode === 'hourly');
            const hasPiece = activeTypes.some(t => t.mode === 'piece');

            const data = {
                types: activeIds,
                note: document.getElementById('noteInput').value,
                startTime: document.getElementById('startTime').value,
                endTime: document.getElementById('endTime').value,
                pieceSum: document.getElementById('pieceSum').value,
                piecePeople: document.getElementById('piecePeople').value,
                rate: parseFloat(document.getElementById('hourlyRate').value) || 11.5,
                hours: 0,
                totalHourly: 0,
                mySharePiece: 0,
                totalAmount: 0
            };

            if (hasHourly) {
                const start = parseTime(data.startTime);
                const end = parseTime(data.endTime);
                if (start && end) {
                    let diff = (end.h * 60 + end.m) - (start.h * 60 + start.m);
                    if (diff < 0) diff += 24 * 60;
                    data.hours = diff / 60;
                    data.totalHourly = data.hours * data.rate;
                }
            }
            if (hasPiece) {
                const sum = parseFloat(data.pieceSum) || 0;
                const people = parseInt(data.piecePeople) || 1;
                if (sum > 0) data.mySharePiece = sum / people;
            }
            data.totalAmount = data.totalHourly + data.mySharePiece;

            shiftsData[selectedDateStr] = data;
            saveShifts();
            closeModal();
            renderAll();
        }

        async function deleteShift() {
            const ok = await showConfirm("Удалить смену за этот день?", { danger: true, okText: 'Удалить' });
            if (!ok) return;
            delete shiftsData[selectedDateStr];
            saveShifts();
            closeModal();
            renderAll();
            showToast('Смена удалена', 'info');
        }

        function updateSummary() {
            const prefix = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;

            shiftTypes.forEach(type => {
                if (type.mode === 'none') return;
                let sum = 0;
                for (const dateStr in shiftsData) {
                    if (!dateStr.startsWith(prefix)) continue;
                    const d = shiftsData[dateStr];
                    if (!d.types || !d.types.includes(type.id)) continue;
                    if (type.mode === 'hourly') sum += d.totalHourly || 0;
                    else if (type.mode === 'piece') sum += d.mySharePiece || 0;
                }
                const el = document.getElementById('sum_' + type.id);
                if (el) el.innerText = sum.toFixed(1);
            });

            let total = 0;
            for (const dateStr in shiftsData) {
                if (!dateStr.startsWith(prefix)) continue;
                total += shiftsData[dateStr].totalAmount || 0;
            }
            const el = document.getElementById('sum_total');
            if (el) el.innerText = total.toFixed(1);
            document.getElementById('monthTotal').innerText = `Общая: ${total.toFixed(2)} р.`;
        }

        // ===== ДЕТАЛИЗАЦИЯ =====
        function openDetails(typeId) {
            const prefix = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;
            let title = '';
            const items = [];
            let total = 0;

            if (typeId === 'total') {
                title = 'Всего';
                for (const dateStr in shiftsData) {
                    if (!dateStr.startsWith(prefix)) continue;
                    const d = shiftsData[dateStr];
                    if (!d.totalAmount) continue;
                    items.push({ day: parseInt(dateStr.split('-')[2]), amount: d.totalAmount, detail: '' });
                    total += d.totalAmount;
                }
            } else {
                const type = getType(typeId);
                if (!type) return;
                title = type.name;
                for (const dateStr in shiftsData) {
                    if (!dateStr.startsWith(prefix)) continue;
                    const d = shiftsData[dateStr];
                    if (!d.types || !d.types.includes(typeId)) continue;

                    let amount = 0;
                    let detail = '';
                    if (type.mode === 'hourly') {
                        amount = d.totalHourly || 0;
                        const parts = [];
                        if (d.startTime && d.endTime) parts.push(`${d.startTime}–${d.endTime}`);
                        if (d.hours) parts.push(`${d.hours.toFixed(1)} ч`);
                        if (d.rate) parts.push(`× ${d.rate} р.`);
                        detail = parts.join(' · ');
                    } else if (type.mode === 'piece') {
                        amount = d.mySharePiece || 0;
                        const parts = [];
                        if (d.pieceSum) parts.push(`Общая ${d.pieceSum} р.`);
                        if (d.piecePeople) parts.push(`${d.piecePeople} чел.`);
                        detail = parts.join(' · ');
                    }
                    items.push({ day: parseInt(dateStr.split('-')[2]), amount, detail });
                    total += amount;
                }
            }

            items.sort((a, b) => a.day - b.day);

            document.getElementById('detailsTitle').innerText = title + ' — ' + monthNames[currentMonth] + ' ' + currentYear;

            let html = '';
            if (items.length === 0) {
                html = '<div class="empty-details">За этот месяц нет записей по этой категории</div>';
            } else {
                items.forEach(it => {
                    html += `<div class="detail-row">
                        <div>
                            <div class="detail-date">${it.day} ${monthNames[currentMonth].toLowerCase()}</div>
                            ${it.detail ? `<div class="detail-sub">${it.detail}</div>` : ''}
                        </div>
                        <span class="detail-amount">${it.amount.toFixed(2)} р.</span>
                    </div>`;
                });
            }

            document.getElementById('detailsList').innerHTML = html;
            document.getElementById('detailsTotal').innerText = total.toFixed(2) + ' р.';
            document.getElementById('detailsModal').classList.add('active');
        }

        function closeDetailsModal() {
            document.getElementById('detailsModal').classList.remove('active');
        }

        // ===== ШАБЛОНЫ =====
        function getTemplates() { return JSON.parse(localStorage.getItem('shiftTemplates') || '[]'); }
        function setTemplates(list) { localStorage.setItem('shiftTemplates', JSON.stringify(list)); }

        function renderTemplates() {
            const templates = getTemplates();
            const section = document.getElementById('templatesSection');
            const container = document.getElementById('templatesList');
            container.innerHTML = '';
            if (templates.length === 0) { section.style.display = 'none'; return; }
            section.style.display = 'block';

            templates.forEach((tpl, idx) => {
                const btn = document.createElement('button');
                btn.className = 'template-btn';
                btn.innerText = tpl.name;
                btn.onclick = () => applyTemplate(idx);

                let pressTimer = null;
                const startPress = () => {
                    pressTimer = setTimeout(() => { pressTimer = null; deleteTemplate(idx); }, 700);
                };
                const cancelPress = () => { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } };
                btn.addEventListener('touchstart', startPress, { passive: true });
                btn.addEventListener('touchend', cancelPress);
                btn.addEventListener('touchmove', cancelPress);
                btn.addEventListener('mousedown', startPress);
                btn.addEventListener('mouseup', cancelPress);

                container.appendChild(btn);
            });
        }

        function applyTemplate(idx) {
            const templates = getTemplates();
            const tpl = templates[idx];
            if (!tpl) return;

            document.querySelectorAll('.type-btn').forEach(b => {
                b.classList.remove('active');
                b.style.background = '';
                b.style.borderColor = '';
            });
            (tpl.types || []).forEach(tId => {
                const btn = document.querySelector(`.type-btn[data-type="${tId}"]`);
                if (btn) {
                    btn.classList.add('active');
                    const type = getType(tId);
                    if (type) { btn.style.background = type.color; btn.style.borderColor = type.color; }
                }
            });

            document.getElementById('hourlyRate').value = tpl.rate || '11.5';
            document.getElementById('startTime').value = tpl.startTime || '';
            document.getElementById('endTime').value = tpl.endTime || '';
            document.getElementById('pieceSum').value = tpl.pieceSum || '';
            document.getElementById('piecePeople').value = tpl.piecePeople || '';

            updateFieldVisibility();
            calculateHours();
            calculatePiece();
        }

        async function saveAsTemplate() {
            const activeIds = Array.from(document.querySelectorAll('.type-btn.active')).map(b => b.dataset.type);
            if (activeIds.length === 0) { showToast('Сначала выбери хотя бы один тип смены', 'error'); return; }

            const newTpl = {
                name: name.trim(),
                types: activeIds,
                rate: parseFloat(document.getElementById('hourlyRate').value) || 11.5,
                startTime: document.getElementById('startTime').value,
                endTime: document.getElementById('endTime').value,
                pieceSum: document.getElementById('pieceSum').value,
                piecePeople: document.getElementById('piecePeople').value
            };

            const templates = getTemplates();
            const existingIdx = templates.findIndex(t => t.name === newTpl.name);
            if (existingIdx >= 0) {
                const ok = await showConfirm('Шаблон с таким именем уже есть. Перезаписать?');
                if (!ok) return;
                templates[existingIdx] = newTpl;
            } else {
                templates.push(newTpl);
            }
            setTemplates(templates);
            renderTemplates();
            showToast('Шаблон сохранён!');

        async function deleteTemplate(idx) {
            const ok = await showConfirm('Удалить этот шаблон?', { danger: true, okText: 'Удалить' });
            if (!ok) return;
            const templates = getTemplates();
            templates.splice(idx, 1);
            setTemplates(templates);
            renderTemplates();
            showToast('Шаблон удалён', 'info');

            document.getElementById('settingsModal').classList.remove('active');

        function addType() {
            const name = prompt('Название нового типа:', 'Новый тип');
            if (!name || !name.trim()) return;
            const id = 'type_' + Date.now();
            shiftTypes.push({ id, name: name.trim(), color: '#888888', mode: 'piece', builtin: false });
            saveTypes();
            renderSettingsTypes();
            renderAll();
            showToast('Тип добавлен');
        }

        async function deleteType(id) {
            const ok = await showConfirm('Удалить этот тип? Дни, где он использовался, останутся, но тип пропадёт из списка и панели.', { danger: true, okText: 'Удалить' });
            if (!ok) return;
            shiftTypes = shiftTypes.filter(t => t.id !== id);
            saveTypes();
            renderSettingsTypes();
            renderAll();
            showToast('Тип удалён', 'info');
        }

        async function resetTypes() {
            const ok = await showConfirm('Сбросить все типы к стандартным? Кастомные типы будут удалены, цвета сброшены.', { danger: true, okText: 'Сбросить' });
            if (!ok) return;
            shiftTypes = JSON.parse(JSON.stringify(DEFAULT_TYPES));
            saveTypes();
            renderSettingsTypes();
            renderAll();
            showToast('Типы сброшены', 'info');
        }

        // ===== ОБЛАКО =====
        function cloudSet(key, value) {
            return new Promise((resolve, reject) => {
                tg.CloudStorage.setItem(key, value, (err, ok) => { if (err) reject(err); else resolve(ok); });
            });
        }
        function cloudGet(key) {
            return new Promise((resolve) => {
                tg.CloudStorage.getItem(key, (err, value) => resolve(value));
            });
        }

        async function syncToCloud() {
            try {
                await cloudSet('shiftsData', JSON.stringify(shiftsData));
                await cloudSet('shiftTypes', JSON.stringify(shiftTypes));
                await cloudSet('shiftTemplates', localStorage.getItem('shiftTemplates') || '[]');
                showToast('Всё сохранено в облако');
            } catch (e) {
                showToast('Ошибка сохранения: ' + (e && e.message ? e.message : 'неизвестно'), 'error');
            }
        }

        async function loadFromCloud() {
            const ok = await showConfirm('Загрузить данные из облака? Локальные данные будут перезаписаны.');
            if (!ok) return;
            try {
                const dataStr = await cloudGet('shiftsData');
                const typesStr = await cloudGet('shiftTypes');
                const tplStr = await cloudGet('shiftTemplates');
                if (dataStr) { shiftsData = migrateData(JSON.parse(dataStr)); saveShifts(); }
                if (typesStr) { shiftTypes = JSON.parse(typesStr); saveTypes(); }
                if (tplStr) { localStorage.setItem('shiftTemplates', tplStr); }
                renderAll();
                renderSettingsTypes();
                showToast('Загружено из облака');
            } catch (e) {
                showToast('Ошибка загрузки: ' + (e && e.message ? e.message : 'неизвестно'), 'error');
            }
        }

        // ===== СТАРТ =====
        renderBottomPanel();
        renderCalendar();
        updateSummary();

        (async () => {
            try {
                const dataStr = await cloudGet('shiftsData');
                const typesStr = await cloudGet('shiftTypes');
                const tplStr = await cloudGet('shiftTemplates');
                if (dataStr) { shiftsData = migrateData(JSON.parse(dataStr)); saveShifts(); }
                if (typesStr) { shiftTypes = JSON.parse(typesStr); saveTypes(); }
                if (tplStr) { localStorage.setItem('shiftTemplates', tplStr); }
            } catch (e) {
                console.error('Ошибка загрузки из облака', e);
            }
            renderAll();
        })();
    </script>
</body>
</html>
