<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Календарь Смен</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 15px;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            padding-bottom: 80px;
        }
        .header { text-align: center; margin-bottom: 15px; }
        .nav-btn { background: #333; color: white; border: none; padding: 5px 15px; border-radius: 8px; font-size: 18px; margin: 0 10px;}
        .month-title { font-size: 20px; font-weight: bold; display: inline-block;}
        
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            margin-top: 10px;
        }
        .day-cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 14px;
            background-color: #2a2a2a;
            cursor: pointer;
        }
        .day-cell.empty { background-color: transparent; pointer-events: none; }
        .day-cell.active { background-color: #0ea5e9; } /* Синий цвет для смен */

        /* Модальное окно */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #2a2a2a;
            width: 100%;
            max-width: 350px;
            border-radius: 16px;
            padding: 20px;
        }
        .modal h2 { margin-top: 0; font-size: 18px; }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #444;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }
        .btn-save { background: #22c55e; }
        .btn-close { background: #ef4444; }
    </style>
</head>
<body>

    <div class="header">
        <button class="nav-btn" onclick="changeMonth(-1)">◀</button>
        <span class="month-title" id="currentMonth">Ноябрь 2026</span>
        <button class="nav-btn" onclick="changeMonth(1)">▶</button>
    </div>

    <div class="calendar-grid" id="calendarGrid"></div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h2 id="modalDate">День</h2>
            <p>Выбери тип смены:</p>
            <button class="btn" onclick="saveShift('Увязка')">Увязка (Синий)</button>
            <button class="btn" onclick="saveShift('Смена')">Смена (Красный)</button>
            <button class="btn" onclick="saveShift('Выходной')">Выходной</button>
            <button class="btn btn-close" onclick="closeModal()">Отмена</button>
        </div>
    </div>

    <script>
        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth();
        let selectedDate = "";
        
        // Загружаем данные из памяти телефона
        let shifts = JSON.parse(localStorage.getItem('myShifts')) || {};
        const months = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];

        // Функции
        function changeMonth(delta) {
            currentMonth += delta;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar();
        }

        function renderCalendar() {
            document.getElementById('currentMonth').innerText = months[currentMonth] + " " + currentYear;
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = "";

            const firstDay = new Date(currentYear, currentMonth, 1);
            const lastDay = new Date(currentYear, currentMonth + 1, 0);
            const daysInMonth = lastDay.getDate();
            
            let startDay = firstDay.getDay();
            if (startDay === 0) startDay = 7; // Воскресенье

            // Пустые клетки
            for (let i = 1; i < startDay; i++) {
                let empty = document.createElement('div');
                empty.className = 'day-cell empty';
                grid.appendChild(empty);
            }

            // Дни
            for (let d = 1; d <= daysInMonth; d++) {
                let cell = document.createElement('div');
                cell.className = 'day-cell';
                cell.innerText = d;
                
                // Формируем дату в формате YYYY-MM-DD
                let dateStr = currentYear + "-" + String(currentMonth + 1).padStart(2, '0') + "-" + String(d).padStart(2, '0');
                
                if (shifts[dateStr]) {
                    cell.classList.add('active');
                }

                // Обработчик нажатия
                cell.onclick = function() {
                    openModal(dateStr, d);
                };

                grid.appendChild(cell);
            }
        }

        function openModal(dateStr, dayNum) {
            selectedDate = dateStr;
            document.getElementById('modalDate').innerText = dayNum + " " + months[currentMonth];
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function saveShift(type) {
            shifts[selectedDate] = type;
            localStorage.setItem('myShifts', JSON.stringify(shifts));
            closeModal();
            renderCalendar();
        }

        // Запуск при открытии
        renderCalendar();
    </script>
</body>
</html>
